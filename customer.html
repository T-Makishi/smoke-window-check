<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ページを移動しています</title>
  <script>
    (()=>{const current=new URL(location.href),tenant=current.searchParams.get('t'),destination=new URL(tenant?'/?t='+encodeURIComponent(tenant):'/trial.html#features',location.origin);location.replace(destination)})();
  </script>
</head>
<body><p>正しいページへ移動しています。</p></body>
</html>
